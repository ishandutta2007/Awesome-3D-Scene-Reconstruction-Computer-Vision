<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- 3D Perspective Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <style>
      .orb-pulse-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .orb-pulse-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .beam-flow {
        stroke-dasharray: 8 16;
        animation: dash 25s linear infinite;
      }
      .rot-cube {
        transform-origin: 1040px 200px;
        animation: floatCube 7s ease-in-out infinite alternate;
      }
      .point-pulse {
        animation: ptGlow 3s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse1 {
        0% { transform: scale(0.9) translate(0, 0); opacity: 0.5; }
        100% { transform: scale(1.2) translate(40px, 20px); opacity: 0.8; }
      }
      @keyframes pulse2 {
        0% { transform: scale(1.1) translate(0, 0); opacity: 0.4; }
        100% { transform: scale(0.85) translate(-30px, -20px); opacity: 0.7; }
      }
      @keyframes floatCube {
        0% { transform: translateY(-12px) rotate(0deg); }
        100% { transform: translateY(12px) rotate(6deg); }
      }
      @keyframes ptGlow {
        0% { r: 3; opacity: 0.4; }
        100% { r: 5.5; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Confined to background layer) -->
  <g filter="blur(50px)">
    <circle class="orb-pulse-1" cx="220" cy="140" r="170" fill="url(#glowGrad1)" />
    <circle class="orb-pulse-2" cx="980" cy="220" r="210" fill="url(#glowGrad2)" />
    <circle cx="600" cy="360" r="150" fill="#0284c7" opacity="0.12" />
  </g>

  <!-- Ground Plane 3D Grid in Background -->
  <g opacity="0.6">
    <rect x="0" y="240" width="1200" height="180" fill="url(#gridPattern)" opacity="0.5" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <!-- Perspective convergence rays -->
    <line x1="600" y1="240" x2="100" y2="420" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="600" y1="240" x2="350" y2="420" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="600" y1="240" x2="600" y2="420" stroke="#818cf8" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="600" y1="240" x2="850" y2="420" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="600" y1="240" x2="1100" y2="420" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.3" />
  </g>

  <!-- Dynamic Point Cloud & Isometric 3D Reconstruction Graphic (Right Background) -->
  <g class="rot-cube" opacity="0.75">
    <!-- Connecting Wireframe Meshes -->
    <polygon points="1040,110 1130,160 1130,260 1040,210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <polygon points="1040,110 950,160 950,260 1040,210" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7" />
    <polygon points="1040,110 1130,160 1040,210 950,160" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.8" />
    <!-- Dynamic Wireframe Diagonals -->
    <line x1="950" y1="160" x2="1130" y2="260" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" class="beam-flow" />
    <line x1="1130" y1="160" x2="950" y2="260" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.4" class="beam-flow" />

    <!-- Gaussian Splatting Ellipses -->
    <ellipse cx="1040" cy="160" rx="36" ry="14" fill="#38bdf8" opacity="0.3" transform="rotate(-20 1040 160)" />
    <ellipse cx="1080" cy="210" rx="42" ry="16" fill="#a855f7" opacity="0.3" transform="rotate(25 1080 210)" />
    <ellipse cx="990" cy="200" rx="30" ry="12" fill="#ec4899" opacity="0.25" transform="rotate(-15 990 200)" />

    <!-- Point Cloud Vertices with Pulse -->
    <circle class="point-pulse" cx="1040" cy="110" r="4" fill="#38bdf8" />
    <circle class="point-pulse" cx="1130" cy="160" r="4" fill="#818cf8" />
    <circle class="point-pulse" cx="1130" cy="260" r="4" fill="#c084fc" />
    <circle class="point-pulse" cx="1040" cy="210" r="4.5" fill="#38bdf8" />
    <circle class="point-pulse" cx="950" cy="160" r="4" fill="#818cf8" />
    <circle class="point-pulse" cx="950" cy="260" r="4" fill="#a855f7" />
    <circle cx="1010" cy="140" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="1070" cy="180" r="2.5" fill="#e0e7ff" opacity="0.8" />
    <circle cx="1000" cy="230" r="2.5" fill="#38bdf8" opacity="0.8" />
    <circle cx="1070" cy="240" r="3" fill="#ec4899" opacity="0.8" />
  </g>

  <!-- Foreground Content: Titles, Subtitles & Badges Guaranteed Sharp and Visible -->
  <!-- Header Tag / Pill -->
  <g transform="translate(80, 58)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="35" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM • 2026</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 142)">
    <text fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome 3D Scene Reconstruction
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 185)">
    <text fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
      Computer Vision &amp; Spatial Intelligence
    </text>
  </g>

  <!-- Tagline Description -->
  <g transform="translate(80, 222)">
    <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Top SaaS Platforms &amp; Open-Source Projects for Photogrammetry, SfM, MVS, NeRFs &amp; 3DGS
    </text>
  </g>

  <!-- Feature Pills in Foreground -->
  <g transform="translate(80, 275)">
    <!-- Pill 1: Photogrammetry & SfM -->
    <g transform="translate(0, 0)">
      <rect width="180" height="36" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
      <text x="18" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📐 Photogrammetry / SfM</text>
    </g>

    <!-- Pill 2: 3D Gaussian Splatting -->
    <g transform="translate(195, 0)">
      <rect width="185" height="36" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
      <text x="16" y="23" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">✨ 3D Gaussian Splatting</text>
    </g>

    <!-- Pill 3: Neural Radiance Fields -->
    <g transform="translate(395, 0)">
      <rect width="185" height="36" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
      <text x="18" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Neural Fields &amp; NeRF</text>
    </g>

    <!-- Pill 4: Foundation Models -->
    <g transform="translate(595, 0)">
      <rect width="195" height="36" rx="8" fill="url(#boxGrad)" stroke="#475569" stroke-width="1" />
      <text x="16" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧠 Foundation 3D Models</text>
    </g>
  </g>

  <!-- Sub-caption row -->
  <g transform="translate(80, 360)">
    <text fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Featuring COLMAP • Nerfstudio • Instant-NGP • VGGT • DUSt3R • RealityCapture • Matterport • Luma AI
    </text>
  </g>
</svg>
